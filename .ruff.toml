line-length = 96

[lint]
select = [
    # eradicate
    "ERA",
    # flake8-annotations
    "ANN",
    # flake8-blind-except
    "BLE",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-commas
    "COM",
    # flake8-comprehensions
    "C4",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-import-conventions
    "ICN",
    # flake8-logging
    "LOG",
    # flake8-logging-format
    "G",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
    # flake8-quotes
    "Q",
    # flake8-raise
    "RSE",
    # flake8-return
    "RET",
    # flake8-self
    "SLF",
    # flake8-simplify
    "SIM",
    # flake8-unused-arguments
    "ARG",
    # flake8-use-pathlib
    "PTH",
    # flynt
    "FLY",
    # isort
    "I",
    # pandas-vet
    "PD",
    # pep8-naming
    "N",
    # Perflint
    "PERF",
    # pycodestyle errors
    "E",
    # pycodestyle warnings
    "W",
    # pydocstyle
    "D1",
    "D2",
    "D3",
    "D400",
    "D401",
    "D402",
    "D403",
    "D404",
    # Pyflakes
    "F",
    # Pylint
    "PL",
    # pyupgrade
    "UP",
    # refurb
    "FURB",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]

ignore = [
    "D203",    # conflict with preferred D211 (No blank lines allowed before class docstring)
    "D212",    # conflict with preferred D213 (Multi-line docstring summary should start at the second line)
    "PD901",   # df is a perfectly fine variable name
    "TRY003",  # too nitpicky
    "UP015",   # explicit is better than implicit
    "FURB118", # too verbose
]
